    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #030308; color: #e2e8f0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow-x: hidden; }
        .neon-text { text-shadow: 0 0 10px rgba(168, 85, 247, 0.8), 0 0 20px rgba(168, 85, 247, 0.5); }
        .neon-border { box-shadow: 0 0 10px rgba(6, 182, 212, 0.4), inset 0 0 10px rgba(6, 182, 212, 0.2); border: 1px solid rgba(6, 182, 212, 0.4); }
        .neon-border-purple { box-shadow: 0 0 15px rgba(168, 85, 247, 0.4), inset 0 0 10px rgba(168, 85, 247, 0.2); border: 1px solid rgba(168, 85, 247, 0.4); }
        
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #080812; }
        ::-webkit-scrollbar-thumb { background: #8b5cf6; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #a855f7; }

        .pulse-glow { animation: pulseGlow 2.5s infinite; }
        @keyframes pulseGlow {
            0% { opacity: 0.6; box-shadow: 0 0 10px #06b6d4; }
            50% { opacity: 1; box-shadow: 0 0 20px #06b6d4, 0 0 30px #a855f7; }
            100% { opacity: 0.6; box-shadow: 0 0 10px #06b6d4; }
        }

        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .glass-panel { background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, collection, getDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'chavpk-app-enterprise';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {};
        
        let app, auth, db;
        try {
            app = initializeApp(firebaseConfig);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch(e) { console.warn("Running in local/offline simulation mode."); }

        window.fb = { app, auth, db, signInAnonymously, signInWithCustomToken, onAuthStateChanged, doc, setDoc, getDoc, appId };
    </script>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // SVG Icons
        const MenuIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>;
        const XIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;
        const MicIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" x2="12" y1="19" y2="22"></line></svg>;
        const PaperclipIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>;
        const SendIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>;
        const ShieldIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ade80" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"></path></svg>;
        const UserIcon = () => <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>;
        
        // Innovative Quantum Node Logo
        const QuantumLogo = () => (
            <svg width="36" height="36" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" className="pulse-glow">
                <circle cx="50" cy="50" r="40" stroke="url(#paint0_linear)" strokeWidth="4" strokeDasharray="10 5" />
                <circle cx="50" cy="50" r="25" stroke="url(#paint1_linear)" strokeWidth="3" />

                    <linearGradient id="paint0_linear" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
                        <stop stopColor="#06b6d4" />
                        <stop offset="1" stopColor="#a855f7" />
                    </linearGradient>
                    <linearGradient id="paint1_linear" x1="100" y1="0" x2="0" y2="100" gradientUnits="userSpaceOnUse">

        function App() {
            const [isDrawerOpen, setIsDrawerOpen] = useState(false);
            const [activeTab, setActiveTab] = useState('home');
            const [systemLog, setSystemLog] = useState("Quantum Core Initialized. Anti-Theft Active.");
            const [user, setUser] = useState(null);

            useEffect(() => {
                const initAuth = async () => {
                    if (!window.fb || !window.fb.auth) return;
                    try {
                        const token = typeof __initial_auth_token !== 'undefined' ? __initial_auth_token : null;
                        if (token) {
                            await window.fb.signInWithCustomToken(window.fb.auth, token);
                        } else {
                            await window.fb.signInAnonymously(window.fb.auth);
                        }
                    } catch (e) { console.log("Offline mode engaged."); }
                };

                const checkFb = setInterval(() => {
                    if (window.fb && window.fb.auth) {
                        clearInterval(checkFb);
                        initAuth();
                        window.fb.onAuthStateChanged(window.fb.auth, (u) => setUser(u));
                    }
                }, 200);
                return () => clearInterval(checkFb);
            }, []);

            useEffect(() => {
                const logs = [
                    "Blockchain Ledger synchronizing... 100% Integrity.",
                    "NLP Edge Models loaded. Offline capability ready.",
                    "Quantum-grade encryption applied to current session.",
                    "Dark Web heuristics monitor: 0 Threats Detected.",
                    "Global Node Network latency: 12ms."
                ];
                let i = 0;
                const interval = setInterval(() => {
                    setSystemLog(logs[i % logs.length]);
                    i++;
                }, 7000);
                return () => clearInterval(interval);
            }, []);

                    case 'register': return <RegistrationView user={user} />;
                    case 'blogs': return <BlogsView />;
                    case 'enterprise': return <EnterpriseView user={user} />;
                    case 'about': return <AboutView />;
                    case 'faqs': return <FAQView />;
                    case 'privacy': return <PrivacyView />;

                    {}
                    <div className={`fixed inset-0 bg-black/80 backdrop-blur-sm z-[60] transition-opacity duration-300 ${isDrawerOpen ? 'opacity-100 visible' : 'opacity-0 invisible'}`} onClick={() => setIsDrawerOpen(false)}>

                                    <button onClick={() => setIsDrawerOpen(false)} className="text-gray-400 hover:text-white p-1 rounded hover:bg-gray-800"><XIcon /></button>
                                </div>
                                
                                <div className="space-y-4 flex-grow">

                                        <span className="font-bold text-white tracking-wide">Real World Problem Solver</span>
                                    </button>
                                    <button onClick={() => {setActiveTab('enterprise'); setIsDrawerOpen(false);}} className="w-full text-left p-4 rounded-xl bg-gray-800/50 hover:bg-gray-700/80 border border-transparent hover:border-cyan-500 transition-all flex items-center space-x-3">
                                        <div className="w-2 h-2 rounded-full bg-cyan-400"></div>
                                        <span className="text-gray-200">Enterprise Payroll / Access</span>
                                    </button>

                                    {/* Quick & Legal Links added to Drawer */}
                                    <div className="pt-6 mt-6 border-t border-gray-800">
                                        <h3 className="text-xs uppercase tracking-widest text-gray-500 font-bold mb-4">Legal & Quick Links</h3>
                                        <div className="space-y-2">
                                            <button onClick={() => {setActiveTab('about'); setIsDrawerOpen(false);}} className="w-full text-left py-2 text-gray-400 hover:text-cyan-400 transition-colors text-sm">About Us</button>
                                            <button onClick={() => {setActiveTab('faqs'); setIsDrawerOpen(false);}} className="w-full text-left py-2 text-gray-400 hover:text-cyan-400 transition-colors text-sm">FAQs & Documentation</button>

                                            <button onClick={() => {setActiveTab('contact'); setIsDrawerOpen(false);}} className="w-full text-left py-2 text-green-400 hover:text-green-300 font-semibold transition-colors text-sm">Get In Touch / Support</button>
                                        </div>
                                    </div>
                                </div>

                                    <div className="space-y-3 text-xs text-gray-500">
                                        <p className="flex items-center space-x-2"><ShieldIcon /> <span className="text-green-400 font-mono">Dark Web Monitor: SAFE</span></p>
                                        <p className="flex items-center space-x-2"><span className="w-1.5 h-1.5 rounded-full bg-blue-500 shadow-[0_0_5px_blue]"></span><span className="font-mono">Quantum Encryption: ACTIVE</span></p>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <main className="flex-grow flex flex-col items-center p-4 md:p-8 w-full z-10 relative">
                        {renderContent()}
                    </main>

                    {}
                    <footer className="border-t border-gray-800 bg-[#05050a]/90 mt-12 py-10 px-4 text-center text-sm text-gray-400 relative z-10">
                        <div className="max-w-5xl mx-auto grid grid-cols-1 md:grid-cols-3 gap-8 mb-8 text-left">
                            <div className="md:col-span-1">
                                <div className="flex items-center space-x-2 mb-4">
                                    <QuantumLogo />
                                    <h4 className="text-white font-bold text-lg">CHAVPK Samadhan</h4>
                                </div>
                                <p className="mb-2 text-gray-500">10-Trillion SQL Query Engine Edge Router.</p>
                                <p className="text-gray-500">Empowering enterprise architecture with quantum NLP and blockchain ledgers.</p>
                            </div>
                            <div>
                                <h4 className="text-cyan-400 font-bold mb-4 uppercase tracking-widest text-xs">Platform</h4>
                                <div className="flex flex-col space-y-2">
                                    <button onClick={() => setActiveTab('solver')} className="hover:text-white transition-colors text-left w-max">Real World Solver (AI)</button>
                                    <button onClick={() => setActiveTab('enterprise')} className="hover:text-white transition-colors text-left w-max">Enterprise Dashboard</button>
                                    <button onClick={() => setActiveTab('register')} className="hover:text-white transition-colors text-left w-max">Register Cloud ID</button>
                                </div>
                            </div>
                            <div>
                                <h4 className="text-purple-400 font-bold mb-4 uppercase tracking-widest text-xs">Resources & Legal</h4>
                                <div className="flex flex-col space-y-2">
                                    <button onClick={() => setActiveTab('about')} className="hover:text-white transition-colors text-left w-max">About Us</button>
                                    <button onClick={() => setActiveTab('privacy')} className="hover:text-white transition-colors text-left w-max">Privacy Policy</button>

                        <div className="fixed bottom-0 left-0 w-full bg-black/90 backdrop-blur-md border-t border-cyan-900/30 text-xs py-1.5 px-4 flex justify-between items-center text-gray-400 z-40 font-mono shadow-[0_-5px_15px_rgba(6,182,212,0.1)]">

        function HomeView({ setActiveTab }) {

                        Enterprise AI Edition v12.5 Ready
                    </div>
                    <h2 className="text-5xl md:text-7xl font-extrabold mb-6 tracking-tight leading-tight">
                        <span className="text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-blue-500 to-purple-600 neon-text">Architecting The Future</span><br/>
                        <span className="text-white">With Quantum NLP</span>
                    </h2>
                    <p className="text-lg md:text-xl text-gray-300 max-w-3xl mb-12 leading-relaxed">
                        The CHAVPK Samadhan dynamically models, evaluates, and solves complex real-world data at scale. Experience true multi-agent synergy powered by local edge computing and blockchain verification.
                    </p>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 w-full max-w-6xl">

                                <ShieldIcon />
                            </div>

            const [messages, setMessages] = useState([
