                                <div><label className="block text-[10px] font-bold uppercase text-gray-400 mb-2">Node Alias</label><input required type="text" className="w-full bg-black/50 border border-gray-700 rounded-xl p-3 text-white focus:border-cyan-400 text-sm" /></div>
                                <div><label className="block text-[10px] font-bold uppercase text-gray-400 mb-2">Secure Link</label><input required type="email" className="w-full bg-black/50 border border-gray-700 rounded-xl p-3 text-white focus:border-cyan-400 text-sm" /></div>
                            </div>
                            <div>
                                <label className="block text-[10px] font-bold uppercase text-gray-400 mb-2">Routing Protocol</label>
                                <select className="w-full bg-black/50 border border-gray-700 rounded-xl p-3 text-white focus:border-cyan-400 text-sm cursor-pointer">
                                    <option>Enterprise License / Scale Up</option>
                                    <option>Novelty Evaluator False Positive Report</option>
                                    <option>Floating Solar Joint Venture</option>
                                </select>
                            </div>
                            <div><label className="block text-[10px] font-bold uppercase text-gray-400 mb-2">Payload (Plain Text)</label><textarea required rows="4" className="w-full bg-black/50 border border-gray-700 rounded-xl p-3 text-white focus:border-cyan-400 text-sm resize-none"></textarea></div>
                            <button type="submit" className="w-full bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg text-sm tracking-widest uppercase">Initiate Transfer</button>
                        </form>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
